# rollback_example.conf - rollback_example 示例配置文件
# 使用说明:
#  - 优先级: 环境变量 -> 配置文件 -> 脚本内默认值
#  - 将本文件放在项目的 etc/ 目录下，脚本会尝试读取 [example] 段的配置项。
#  - 注释以 '#' 开头；去掉注释并修改值以生效。

[example]
# 应用部署目录，示例：/opt/app
TARGET_DIR=/opt/app

# 要部署的 JAR 名称，示例：app-1.2.3.jar
JAR_NAME=app-1.2.3.jar

# 容器或服务名称（脚本中用于 docker stop/restart 等）
CONTAINER_NAME=app

# 备份文件名（可选）。若留空或注释，脚本会按默认规则生成带时间戳的备份名。
# 示例：BACKUP_NAME=bak20260101120000-app-1.2.3.jar
#BACKUP_NAME=

# 其他可选配置示例（保持注释以示例说明）：
#LOG_FILE=/var/log/rollback_example.log